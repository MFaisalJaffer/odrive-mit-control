controller_manager:
  ros__parameters:
    update_rate: 1000  # 1kHz loop is standard for impedance control

    leg_impedance_controller:
      type: "my_robot_controllers/LegImpedanceController"

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"

leg_impedance_controller:
  ros__parameters:
    joints:
      - hip_joint
      - knee_joint
      - ankle_joint